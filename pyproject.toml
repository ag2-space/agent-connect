[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ag2-agent-connect"
dynamic = ["version"]
description = "Connect your local agent (Codex, Hermes, …) to AG2 Space as a first-class room agent."
readme = "README.md"
# Bounded by agent-client-protocol (0.12.0 supports >=3.10,<3.15); a wider range
# makes fresh resolutions (uv) fail outright.
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
keywords = ["ag2space", "codex", "matrix", "agent", "bridge"]
# `dependencies = []` ended at docs/adr/0001: the maintained ACP SDK for Python
# carries pydantic, and that was accepted knowingly when ACP became the local
# execution seam. Verified interoperating with
# @agentclientprotocol/claude-agent-acp 0.64.2 at 0.12.0; pinned below 1.0
# because it is pre-1.0 and its callback signatures are not yet stable.
#
# `ag2-relay-client` is the transport, built in `relay-client/` in this same
# repository and published as its own distribution — a *version* of it, never a
# copy, because sutando will take the same version later and vendoring is the
# disease its drift tests already treat (ADR 0001). It is stdlib-only, so this
# adds no dependency tree.
#
# It is not on PyPI yet, and a floor of `>=0.1.0` against an unpublished name
# made `pip install -e .` fail at resolution — which is also why the ACP suites,
# whose printed remedy is `pip install -e .`, could not be run at all. Until the
# first release it resolves from the directory beside this one. That keeps it a
# *version* rather than a copy: the path points at the same distribution the
# PyPI name will carry, so the swap back is one line and no import moves.
dependencies = [
    "agent-client-protocol>=0.12,<1.0",
    "ag2-relay-client",
]

[tool.uv.sources]
ag2-relay-client = { path = "relay-client", editable = true }

[tool.pip]
# pip has no lockfile-independent equivalent of `[tool.uv.sources]`; installing
# with pip needs the sibling first:
#     pip install -e relay-client && pip install -e .

[project.scripts]
agent-connect = "agent_connect.worker:main"

[tool.setuptools.packages.find]
include = ["agent_connect*"]

[tool.setuptools.dynamic]
version = { attr = "agent_connect.__version__" }
